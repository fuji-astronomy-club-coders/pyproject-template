[project]
name = "pyproject-template"
version = "0.0.0"
requires-python = ">=3.13"

[tool.pyright]
extraPaths = ["."]
typeCheckingMode = "basic"
pythonVersion = "3.13"


[tool.ruff]
target-version = "py313"
line-length = 112

[tool.ruff.lint]

exclude = []
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
    "SIM",
    "PTH",
    "A",
    "ANN",
]
ignore = [
    "E501",
]


